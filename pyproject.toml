[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ethutils"
version = "0.2.0"
description = "Structural and bounded symbolic analysis utilities for EVM bytecode"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Gernot Salzer"}]
dependencies = ["cbor2>=6.2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/gsalzer/ethutils"
Documentation = "https://github.com/gsalzer/ethutils/blob/main/API.md"
Repository = "https://github.com/gsalzer/ethutils"

[tool.setuptools]
packages = ["ethutils", "ethutils._engine"]

[tool.setuptools.package-data]
ethutils = ["py.typed"]
